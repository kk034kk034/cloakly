name: Mobile Internal Release

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Which platform to build and upload
        required: true
        default: both
        type: choice
        options:
          - both
          - android
          - ios
      revoke_ios_certs:
        description: Revoke all Apple Distribution certs before creating a new one (use once when slots are full)
        required: false
        default: false
        type: boolean

concurrency:
  group: mobile-internal-${{ github.ref }}
  cancel-in-progress: false

jobs:
  android:
    if: inputs.platform == 'both' || inputs.platform == 'android'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Pub get
        run: flutter pub get

      - name: Decode Android signing
        working-directory: apps/mobile/android
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, binascii, os
          from pathlib import Path

          def clean(value: str) -> str:
              return value.lstrip("\ufeff\ufffe").strip()

          raw = clean(os.environ["ANDROID_KEYSTORE_BASE64"])
          cleaned = "".join(raw.split())
          try:
              data = base64.b64decode(cleaned, validate=False)
          except binascii.Error as exc:
              raise SystemExit(f"ANDROID_KEYSTORE_BASE64 decode failed: {exc}") from exc
          if len(data) < 64:
              raise SystemExit(f"Decoded keystore too small ({len(data)} bytes); secret likely corrupted")
          Path("upload-keystore.p12").write_bytes(data)
          alias = clean(os.environ["ANDROID_KEY_ALIAS"])
          store_password = clean(os.environ["ANDROID_KEYSTORE_PASSWORD"])
          key_password = clean(os.environ["ANDROID_KEY_PASSWORD"])
          Path("key.properties").write_text(
              "\n".join(
                  [
                      f"storePassword={store_password}",
                      f"keyPassword={key_password}",
                      f"keyAlias={alias}",
                      "storeFile=upload-keystore.p12",
                      "",
                  ]
              ),
              encoding="ascii",
          )
          print(f"Wrote upload-keystore.p12 ({len(data)} bytes), alias={alias!r}")
          PY

      - name: Write dart-define config
        working-directory: apps/mobile
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          REVENUECAT_APPLE_API_KEY: ${{ secrets.REVENUECAT_APPLE_API_KEY }}
          REVENUECAT_GOOGLE_API_KEY: ${{ secrets.REVENUECAT_GOOGLE_API_KEY }}
          REVENUECAT_ENTITLEMENT_ID: ${{ secrets.REVENUECAT_ENTITLEMENT_ID }}
        run: |
          set -euo pipefail
          mkdir -p config
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          Path("config/ci.json").write_text(
              json.dumps(
                  {
                      "SUPABASE_URL": os.environ["SUPABASE_URL"],
                      "SUPABASE_PUBLISHABLE_KEY": os.environ["SUPABASE_PUBLISHABLE_KEY"],
                      "REVENUECAT_APPLE_API_KEY": os.environ.get("REVENUECAT_APPLE_API_KEY", ""),
                      "REVENUECAT_GOOGLE_API_KEY": os.environ.get("REVENUECAT_GOOGLE_API_KEY", ""),
                      "REVENUECAT_ENTITLEMENT_ID": os.environ.get("REVENUECAT_ENTITLEMENT_ID") or "pro",
                  },
                  indent=2,
              )
              + "\n",
              encoding="utf-8",
          )
          PY

      - name: Build App Bundle
        working-directory: apps/mobile
        run: flutter build appbundle --release --dart-define-from-file=config/ci.json

      - name: Upload to Play Internal testing
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.cloud52.cloakly
          releaseFiles: apps/mobile/build/app/outputs/bundle/release/app-release.aab
          track: internal
          status: completed

  ios:
    if: inputs.platform == 'both' || inputs.platform == 'ios'
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Pub get
        run: flutter pub get

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
          working-directory: apps/mobile/ios

      - name: Write dart-define config
        working-directory: apps/mobile
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          REVENUECAT_APPLE_API_KEY: ${{ secrets.REVENUECAT_APPLE_API_KEY }}
          REVENUECAT_GOOGLE_API_KEY: ${{ secrets.REVENUECAT_GOOGLE_API_KEY }}
          REVENUECAT_ENTITLEMENT_ID: ${{ secrets.REVENUECAT_ENTITLEMENT_ID }}
        run: |
          set -euo pipefail
          mkdir -p config
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          Path("config/ci.json").write_text(
              json.dumps(
                  {
                      "SUPABASE_URL": os.environ["SUPABASE_URL"],
                      "SUPABASE_PUBLISHABLE_KEY": os.environ["SUPABASE_PUBLISHABLE_KEY"],
                      "REVENUECAT_APPLE_API_KEY": os.environ.get("REVENUECAT_APPLE_API_KEY", ""),
                      "REVENUECAT_GOOGLE_API_KEY": os.environ.get("REVENUECAT_GOOGLE_API_KEY", ""),
                      "REVENUECAT_ENTITLEMENT_ID": os.environ.get("REVENUECAT_ENTITLEMENT_ID") or "pro",
                  },
                  indent=2,
              )
              + "\n",
              encoding="utf-8",
          )
          PY

      - name: Build IPA and upload TestFlight
        working-directory: apps/mobile/ios
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          APPLE_CERT_P12_BASE64: ${{ secrets.APPLE_CERT_P12_BASE64 }}
          APPLE_CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
          REVOKE_IOS_DIST_CERTS: ${{ inputs.revoke_ios_certs && '1' || '0' }}
        run: bundle exec fastlane internal

      - name: Upload exported iOS distribution cert (first-time bootstrap)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-distribution-cert
          path: |
            apps/mobile/ios/dist-ci.p12
            apps/mobile/ios/dist-ci.p12.base64.txt
          if-no-files-found: ignore
