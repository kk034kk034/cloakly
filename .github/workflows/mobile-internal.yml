name: Mobile Internal Release

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Which platform to build and upload
        required: true
        default: both
        type: choice
        options:
          - both
          - android
          - ios

concurrency:
  group: mobile-internal-${{ github.ref }}
  cancel-in-progress: false

jobs:
  android:
    if: inputs.platform == 'both' || inputs.platform == 'android'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Pub get
        run: flutter pub get

      - name: Decode Android signing
        working-directory: apps/mobile/android
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > upload-keystore.p12
          python3 - <<'PY'
          import os
          from pathlib import Path
          Path("key.properties").write_text(
              "\n".join(
                  [
                      f"storePassword={os.environ['ANDROID_KEYSTORE_PASSWORD']}",
                      f"keyPassword={os.environ['ANDROID_KEY_PASSWORD']}",
                      f"keyAlias={os.environ['ANDROID_KEY_ALIAS']}",
                      "storeFile=upload-keystore.p12",
                      "",
                  ]
              ),
              encoding="utf-8",
          )
          PY

      - name: Write dart-define config
        working-directory: apps/mobile
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          REVENUECAT_APPLE_API_KEY: ${{ secrets.REVENUECAT_APPLE_API_KEY }}
          REVENUECAT_GOOGLE_API_KEY: ${{ secrets.REVENUECAT_GOOGLE_API_KEY }}
          REVENUECAT_ENTITLEMENT_ID: ${{ secrets.REVENUECAT_ENTITLEMENT_ID }}
        run: |
          set -euo pipefail
          mkdir -p config
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          Path("config/ci.json").write_text(
              json.dumps(
                  {
                      "SUPABASE_URL": os.environ["SUPABASE_URL"],
                      "SUPABASE_PUBLISHABLE_KEY": os.environ["SUPABASE_PUBLISHABLE_KEY"],
                      "REVENUECAT_APPLE_API_KEY": os.environ.get("REVENUECAT_APPLE_API_KEY", ""),
                      "REVENUECAT_GOOGLE_API_KEY": os.environ.get("REVENUECAT_GOOGLE_API_KEY", ""),
                      "REVENUECAT_ENTITLEMENT_ID": os.environ.get("REVENUECAT_ENTITLEMENT_ID") or "pro",
                  },
                  indent=2,
              )
              + "\n",
              encoding="utf-8",
          )
          PY

      - name: Build App Bundle
        working-directory: apps/mobile
        run: flutter build appbundle --release --dart-define-from-file=config/ci.json

      - name: Upload to Play Internal testing
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.cloud52.cloakly
          releaseFiles: apps/mobile/build/app/outputs/bundle/release/app-release.aab
          track: internal
          status: completed

  ios:
    if: inputs.platform == 'both' || inputs.platform == 'ios'
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Pub get
        run: flutter pub get

      - name: Write dart-define config
        working-directory: apps/mobile
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          REVENUECAT_APPLE_API_KEY: ${{ secrets.REVENUECAT_APPLE_API_KEY }}
          REVENUECAT_GOOGLE_API_KEY: ${{ secrets.REVENUECAT_GOOGLE_API_KEY }}
          REVENUECAT_ENTITLEMENT_ID: ${{ secrets.REVENUECAT_ENTITLEMENT_ID }}
        run: |
          set -euo pipefail
          mkdir -p config
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          Path("config/ci.json").write_text(
              json.dumps(
                  {
                      "SUPABASE_URL": os.environ["SUPABASE_URL"],
                      "SUPABASE_PUBLISHABLE_KEY": os.environ["SUPABASE_PUBLISHABLE_KEY"],
                      "REVENUECAT_APPLE_API_KEY": os.environ.get("REVENUECAT_APPLE_API_KEY", ""),
                      "REVENUECAT_GOOGLE_API_KEY": os.environ.get("REVENUECAT_GOOGLE_API_KEY", ""),
                      "REVENUECAT_ENTITLEMENT_ID": os.environ.get("REVENUECAT_ENTITLEMENT_ID") or "pro",
                  },
                  indent=2,
              )
              + "\n",
              encoding="utf-8",
          )
          PY

      - name: Install Apple API key
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
        run: |
          set -euo pipefail
          mkdir -p "$HOME/private_keys"
          printf '%s\n' "$ASC_KEY_P8" > "$HOME/private_keys/AuthKey_${ASC_KEY_ID}.p8"

      - name: Build IPA
        working-directory: apps/mobile
        run: |
          set -euo pipefail
          flutter build ipa --release \
            --dart-define-from-file=config/ci.json \
            --export-options-plist=ios/ExportOptions.plist

      - name: Upload to TestFlight
        working-directory: apps/mobile
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -euo pipefail
          IPA=$(ls build/ios/ipa/*.ipa | head -n 1)
          xcrun altool --upload-app --type ios \
            --file "$IPA" \
            --apiKey "$ASC_KEY_ID" \
            --apiIssuer "$ASC_ISSUER_ID"
