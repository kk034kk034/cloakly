name: cloakly_core
description: Cloakly 桌面版與手機版共用的會議核心與 Flutter UI。
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.12.2

resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  go_router: ^16.0.0
  flutter_localizations:
    sdk: flutter
  record: ^6.1.1
  path_provider: ^2.1.5
  shared_preferences: ^2.5.3
  sqflite: ^2.4.2
  sqflite_common_ffi: ^2.3.6
  sqlite3_flutter_libs: ^0.5.39
  uuid: ^4.5.1
  http: ^1.5.0
  intl: ^0.20.2
  flutter_markdown: ^0.7.7+1
  path: ^1.9.1
  wakelock_plus: ^1.3.2
  share_plus: ^11.0.0
  file_picker: ^10.3.2
  archive: ^4.0.0
  xml: ^6.6.1
  pdfrx: '>=2.4.3 <2.6.0'

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
